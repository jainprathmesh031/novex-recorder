name: Build NOVEX APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Finds a folder that has BOTH settings.gradle(.kts) and app/.
      # If the repo has no such folder (app/ was not uploaded), it looks for
      # the project .zip inside the repo and extracts it.
      - name: Locate Android project
        id: locate
        run: |
          find_project() {
            for s in $(find . \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "./.git/*" -not -path "*/build/*"); do
              d=$(dirname "$s")
              if [ -d "$d/app" ] && [ -f "$d/app/build.gradle.kts" -o -f "$d/app/build.gradle" ]; then
                echo "$d"; return 0
              fi
            done
            return 1
          }

          DIR=$(find_project || true)

          if [ -z "$DIR" ]; then
            echo "No complete project in repo, looking for a .zip ..."
            for z in $(find . -name "*.zip" -not -path "./.git/*" -not -path "./_extracted/*"); do
              echo "Extracting $z"
              mkdir -p _extracted
              unzip -o -q "$z" -d _extracted
            done
            DIR=$(find_project || true)
          fi

          if [ -z "$DIR" ]; then
            echo "::error::Could not find a folder containing settings.gradle(.kts) AND app/. The 'app' folder was not uploaded to the repo. Commit the full project (or the .zip) to GitHub."
            echo "Files in repo:"
            git ls-files | head -100
            exit 1
          fi

          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # packages: '' avoids the removed legacy "tools" package.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build debug APK (backup)
        if: always() && steps.locate.outcome == 'success'
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: always() && steps.locate.outcome == 'success'
        with:
          name: novex-recorder-apk
          path: |
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
            ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
